<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>생일 축하해! 🎉</title>
  <style>
    /* 기본 여백 초기화 및 박스 모델 설정 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* 전체 화면 레이아웃: 진한 파랑 배경 및 흰색 기본 텍스트 */
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #1c2541 0%, #0b132b 100%);
      color: #ffffff;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    /* 화면 전체를 덮는 색종이(Confetti) 캔버스 */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* 화면 정중앙 콘텐츠 컨테이너 */
    .celebration-container {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      user-select: none;
    }

    /* 위아래로 통통 튀는 케이크 이모지 */
    .cake-emoji {
      font-size: clamp(5rem, 16vw, 8.5rem);
      line-height: 1.1;
      margin-bottom: 24px;
      display: inline-block;
      filter: drop-shadow(0 16px 24px rgba(0, 0, 0, 0.45));
      animation: bounceCake 1.4s cubic-bezier(0.28, 0.84, 0.42, 1) infinite;
      transform-origin: bottom center;
    }

    /* 케이크 통통 튀는 키프레임 (착지 시 살짝 눌리는 탄성 효과 포함) */
    @keyframes bounceCake {
      0%, 100% {
        transform: translateY(0) scale(1.06, 0.94);
      }
      15% {
        transform: translateY(0) scale(0.95, 1.05);
      }
      45% {
        transform: translateY(-38px) scale(1, 1);
      }
      75% {
        transform: translateY(0) scale(1.04, 0.96);
      }
      88% {
        transform: translateY(-10px) scale(0.99, 1.01);
      }
    }

    /* 무지개색으로 부드럽게 변하는 축하 문구 */
    .birthday-title {
      font-size: clamp(2.2rem, 7.5vw, 4.5rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.25;
      margin-bottom: 16px;
      background: linear-gradient(
        90deg,
        #ff4d4d,
        #ff9f1c,
        #ffe66d,
        #2ec4b6,
        #3a86ff,
        #9b5de5,
        #ff4d4d
      );
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: rainbowShift 4s linear infinite;
      filter: drop-shadow(0 4px 18px rgba(255, 255, 255, 0.15));
    }

    /* 무지개 그라데이션 이동 애니메이션 */
    @keyframes rainbowShift {
      0% {
        background-position: 0% 50%;
      }
      100% {
        background-position: 300% 50%;
      }
    }

    /* 따뜻한 보조 축하 문구 (흰색 텍스트) */
    .birthday-subtitle {
      font-size: clamp(1rem, 3vw, 1.35rem);
      font-weight: 500;
      color: #ffffff;
      opacity: 0.9;
      letter-spacing: -0.01em;
      line-height: 1.6;
      max-width: 480px;
      word-break: keep-all;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body>

  <!-- 색종이 애니메이션 캔버스 -->
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <!-- 중앙 생일 축하 메시지 영역 -->
  <main class="celebration-container">
    <div class="cake-emoji" role="img" aria-label="생일 케이크">🎂</div>
    <h1 class="birthday-title">생일 축하해! 🎉</h1>
    <p class="birthday-subtitle">오늘 하루 세상에서 가장 행복하고 반짝이는 순간들로 가득하길 바라!</p>
  </main>

  <script>
    (function () {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');

      let width = 0;
      let height = 0;
      let confettiPieces = [];

      // 밤하늘 배경에서 선명하게 빛나는 색종이 색상 팔레트
      const COLORS = [
        '#FF595E', // 코랄 레드
        '#FFCA3A', // 선샤인 옐로우
        '#8AC926', // 라임 그린
        '#1982C4', // 브라이트 블루
        '#6A4C93', // 바이올렛
        '#FF924C', // 오렌지
        '#00F5D4', // 민트 시안
        '#F15BB5'  // 핫 핑크
      ];

      // 화면 크기에 맞춰 캔버스 해상도 조정 (고해상도 디스플레이 대응)
      function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      // 개별 색종이 조각 클래스
      class Confetti {
        constructor(initialY = null) {
          this.reset(initialY);
        }

        reset(initialY = null) {
          this.x = Math.random() * width;
          this.y = initialY !== null ? initialY : -20 - Math.random() * height * 0.2;
          this.w = 8 + Math.random() * 8;
          this.h = 5 + Math.random() * 6;
          this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
          this.speedY = 1.6 + Math.random() * 2.6;
          this.speedX = (Math.random() - 0.5) * 1.2;
          this.rotation = Math.random() * Math.PI * 2;
          this.rotationSpeed = (Math.random() - 0.5) * 0.08;
          this.wobble = Math.random() * Math.PI * 2;
          this.wobbleSpeed = 0.03 + Math.random() * 0.04;
          this.flip = Math.random() * Math.PI;
          this.flipSpeed = 0.04 + Math.random() * 0.06;
        }

        update() {
          this.wobble += this.wobbleSpeed;
          this.flip += this.flipSpeed;
          this.rotation += this.rotationSpeed;

          // 바람에 흔들리며 떨어지는 움직임 계산
          this.x += this.speedX + Math.sin(this.wobble) * 0.9;
          this.y += this.speedY;

          // 화면 아래로 벗어나면 상단에서 다시 생성
          if (this.y > height + 25) {
            this.reset();
          }
          if (this.x > width + 25) {
            this.x = -25;
          } else if (this.x < -25) {
            this.x = width + 25;
          }
        }

        draw() {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rotation);
          // 팔랑거리는 입체 회전을 표현하기 위해 Y축 스케일 조절
          ctx.scale(1, Math.cos(this.flip));
          ctx.fillStyle = this.color;
          ctx.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);
          ctx.restore();
        }
      }

      // 화면 크기에 비례하여 적절한 개수의 색종이 초기화
      function initConfetti() {
        const count = Math.min(160, Math.max(70, Math.floor((width * height) / 9000)));
        confettiPieces = [];
        for (let i = 0; i < count; i++) {
          confettiPieces.push(new Confetti(Math.random() * height));
        }
      }

      // 메인 애니메이션 루프
      function animate() {
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < confettiPieces.length; i++) {
          confettiPieces[i].update();
          confettiPieces[i].draw();
        }
        requestAnimationFrame(animate);
      }

      // 창 크기 변경 이벤트 처리
      window.addEventListener('resize', () => {
        resizeCanvas();
        initConfetti();
      });

      // 페이지 로드 완료 후 실행
      window.addEventListener('load', () => {
        resizeCanvas();
        initConfetti();
        animate();
      });
    })();
  </script>
</body>
</html>
